<!-- قسم البحث الذكي المربوط بـ Gemini للسلم السداسي -->
<div class="gemini-search-container" style="margin: 20px auto; padding: 20px; background: #f9f9f9; border-radius: 8px; max-width: 800px; font-family: Tahoma, sans-serif; direction: rtl; text-align: right;">
    <h3>المساعد الذكي لمعجم الحقول الدلالية (CEMF-v2) - السلم السداسي</h3>
    
    <!-- إعدادات مفتاح الـ API (اختياري للزوار، مع مفتاح افتراضي مدمج للعمل المباشر) -->
    <div style="margin-bottom: 15px; padding: 10px; background: #e8f4fd; border: 1px solid #b8daff; border-radius: 4px;">
        <details>
            <summary style="font-size: 13px; font-weight: bold; cursor: pointer; color: #004085;">إعدادات متقدمة: استخدام مفتاح API مخصص (اختياري)</summary>
            <div style="margin-top: 10px;">
                <label for="apiKeyInput" style="font-size: 13px; display: block; margin-bottom: 5px;">مفتاح Gemini API الخاص بك:</label>
                <input type="password" id="apiKeyInput" placeholder="أدخل مفتاح API هنا..." style="width: 70%; padding: 6px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px;">
                <button onclick="saveApiKey()" style="padding: 6px 12px; font-size: 13px; background: #28a745; color: #fff; border: none; border-radius: 4px; cursor: pointer;">حفظ</button>
                <span id="keyStatus" style="font-size: 12px; margin-right: 10px; color: green;"></span>
            </div>
        </details>
    </div>

    <p>استعلم عن أي جذر أو كلمة قرآنية لتحليلها وفق السلم السداسي:</p>
    
    <input type="text" id="userInput" placeholder="أدخل الكلمة أو الجذر (مثل: صَبْر، حَقّ)..." style="width: 70%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px;">
    <button onclick="askGeminiLexicon()" style="padding: 10px 20px; font-size: 16px; background: #2c3e50; color: #fff; border: none; border-radius: 4px; cursor: pointer;">تحليل ذكي</button>
    
    <div id="aiResponse" style="margin-top: 15px; padding: 15px; background: #fff; border: 1px solid #ddd; border-radius: 4px; min-height: 80px; white-space: pre-line;">
        ستظهر نتيجة التحليل الأصولي وفق السلم السداسي هنا...
    </div>
</div>

<script>
// المفتاح الافتراضي المدمج لضمان عمل المنصة للزوار مباشرة دون طلب مفتاح
const DEFAULT_GEMINI_KEY = ""; // ضع مفتاحك الأساسي هنا إذا أردت تضمينه، أو اتركه فارغاً ليعتمد على التخزين المحلي

window.onload = function() {
    const savedKey = localStorage.getItem('gemini_lexicon_key');
    if (savedKey) {
        document.getElementById('apiKeyInput').value = savedKey;
        document.getElementById('keyStatus').innerHTML = "✓ تم استرجاع المفتاح المحفوظ";
    }
};

function saveApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (key) {
        localStorage.setItem('gemini_lexicon_key', key);
        document.getElementById('keyStatus').innerHTML = "✓ تم الحفظ بنجاح";
    } else {
        alert("الرجاء إدخال مفتاح صحيح.");
    }
}

async function askGeminiLexicon() {
    const query = document.getElementById('userInput').value.trim();
    const customKey = document.getElementById('apiKeyInput').value.trim();
    const apiKey = customKey || DEFAULT_GEMINI_KEY;
    const responseBox = document.getElementById('aiResponse');
    
    if (!apiKey) {
        alert("الرجاء إدخال مفتاح Gemini API في إعدادات المتقدمة بالأسفل أو تعيين مفتاح التشغيل.");
        return;
    }
    
    if (!query) {
        responseBox.innerHTML = "الرجاء إدخال كلمة أو جذر للبحث.";
        return;
    }
    
    responseBox.innerHTML = "جاري التحليل الأصولي والحقلي عبر نموذج الذكاء الاصطناعي وفق السلم السداسي...";
    
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
    
    const systemInstruction = `أنت محرك التحليل الأصولي والحقلي المعتمد لـ "معجم الكلمات الحقولية المكثفة في القرآن الكريم (CEMF-v2)". 
عندما يطلب المستخدم تحليل أي كلمة أو جذر قرآني، يجب عليك تطبيق "السلم السداسي" وتحليلها بدقة وفق العناصر التالية حصراً:

1. البناء والصوت: (الخصائص الصوتية للجذر، الجرس الصوتي، والتوافق بين جرس الكلمة ودلالتها المعجمية).
2. الحقل التكميلي: (الكلمات والمفردات التي تكمل المعنى وتعمل معه في نسق دلالي متصل داخل السياق القرآني).
3. الحقل المجاور: (المفردات ذات القربى الدلالية التي تشترك مع الكلمة في الإطار العام لكنها تختلف في التخوم).
4. الحقل الموازي والمضاد: (المقابِلات أو الأضداد التي تبرز المعنى بالتضاد أو التوازي المنهجي).
5. التقسيمات والتقاطعات: (تفريع الدلالات، وتداخل الحقول، ومواقع التقاطع الدلالي للكلمة مع حقول أخرى).
6. لطائف القرآن والنكت البلاغية: (الإشارات البلاغية، والوجوه التفسيرية الدقيقة، واللطائف البيانية الخاصة بالآيات الواردة فيها).

اجعل ردك علمياً، محققاً، ومقسماً بعناوين واضحة تماماً وفق هذا السلم السداسي لكل كلمة يتم إدخالها.`;

    const promptText = `${systemInstruction}\n\nالكلمة أو الجذر المراد تحليله بمعايير السلم السداسي: "${query}"`;

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: promptText }] }]
            })
        });
        
        const data = await response.json();
        if (data.candidates && data.candidates[0].content) {
            const reply = data.candidates[0].content.parts[0].text;
            responseBox.innerHTML = reply;
        } else {
            responseBox.innerHTML = "حدث خطأ في استجابة النموذج. تأكد من صحة مفتاح الـ API أو الرصيد.";
        }
    }
    catch (error) {
        responseBox.innerHTML = "حدث خطأ أثناء الاتصال بالذكاء الاصطناعي. تأكد من الاتصال بالإنترنت وصحة المفتاح.";
        console.error(error);
    }
}
</script>

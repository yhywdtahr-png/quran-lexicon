<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معجم الحقول الدلالية في القرآن الكريم</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-2xl bg-white shadow-md rounded-2xl p-6 mt-6 border border-slate-100">
        <h1 class="text-2xl font-bold text-center text-emerald-800 mb-2">معجم الحقول الدلالية القرآنية</h1>
        <p class="text-sm text-slate-500 text-center mb-6">ابحث عن أي كلمة أو جذر قرآني لاستخراج التحليل اللغوي والدلالي</p>

        <!-- حقل البحث -->
        <div class="flex gap-2 mb-4">
            <input type="text" id="searchInput" placeholder="اكتب الكلمة القرآنية أو الجذر (مثل: فوز، صدقة)..." 
                class="flex-1 px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-600 text-base">
            <button onclick="performSearch()" id="searchBtn"
                class="bg-emerald-700 hover:bg-emerald-800 text-white px-6 py-3 rounded-xl font-medium transition-colors cursor-pointer">
                بحث
            </button>
        </div>

        <!-- رابط إعدادات المفتاح -->
        <div class="text-left mb-6">
            <button onclick="toggleSettings()" class="text-xs text-slate-400 hover:text-emerald-700 underline cursor-pointer">
                إعدادات المفتاح
            </button>
        </div>

        <!-- خانة إدخال المفتاح (مخفية افتراضياً) -->
        <div id="settingsArea" class="hidden mb-6 p-4 bg-slate-50 border border-slate-200 rounded-xl">
            <label class="block text-xs font-medium text-slate-600 mb-1">مفتاح Gemini API:</label>
            <div class="flex gap-2">
                <input type="password" id="apiKeyInput" placeholder="أدخل مفتاح الـ API هنا..." 
                    class="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-emerald-600">
                <button onclick="saveApiKey()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium">
                    حفظ
                </button>
            </div>
        </div>

        <!-- منطقة النتائج -->
        <div id="resultArea" class="hidden bg-emerald-50/50 border border-emerald-100 rounded-xl p-4 text-slate-700 leading-relaxed">
            <h3 class="font-bold text-emerald-900 mb-2 border-b border-emerald-200 pb-1">نتيجة التحليل الدلالي:</h3>
            <div id="resultContent" class="whitespace-pre-wrap text-sm sm:text-base"></div>
        </div>
    </div>

    <script>
        // استرجاع المفتاح المحفوظ محلياً عند التحميل
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        });

        function toggleSettings() {
            const area = document.getElementById('settingsArea');
            area.classList.toggle('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('تم حفظ المفتاح بنجاح على جهازك!');
                toggleSettings();
            } else {
                alert('الرجاء إدخال مفتاح صحيح.');
            }
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();
            const resultArea = document.getElementById('resultArea');
            const resultContent = document.getElementById('resultContent');
            const searchBtn = document.getElementById('searchBtn');

            if (!apiKey) {
                alert('الرجاء إدخال مفتاح الـ API أولاً عبر الضغط على "إعدادات المفتاح".');
                document.getElementById('settingsArea').classList.remove('hidden');
                return;
            }

            if (!query) {
                alert('الرجاء كتابة كلمة للبحث عنها.');
                return;
            }

            resultArea.classList.remove('hidden');
            resultContent.innerHTML = 'جاري تحليل الحقل الدلالي واستخراج المعاني...';
            searchBtn.disabled = true;

            try {
                const promptText = `أنت عالم لغة وخبير في معجم الحقول الدلالية القرآنية. قم بتحليل الكلمة القرآنية التالية بدقة: "${query}".
                قدم التحليل بالشكل التالي:
                1. الجذر اللغوي والمادة.
                2. الحقل الدلالي الأساسي الذي تنتمي إليه.
                3. الآيات أو السياق القرآني الأبرز للكلمة.
                4. الدلالة المركزية والمعنى المعجمي باختصار وتنسيق مرتب.`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: promptText }]
                        }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message || 'خطأ من الخادم');
                }

                const outputText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (outputText) {
                    resultContent.innerHTML = outputText;
                } else {
                    resultContent.innerHTML = 'لم يتم تلقي إجابة صحيحة من النموذج.';
                }

            } catch (error) {
                console.error(error);
                resultContent.innerHTML = 'حدث خطأ أثناء الاتصال: ' + error.message;
            } finally {
                searchBtn.disabled = false;
            }
        }
    </script>
</body>
</html>

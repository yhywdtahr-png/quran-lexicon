<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معجم الحقول الدلالية في القرآن الكريم</title>
    <!-- مكتبة Tailwind CSS للتصميم العصري -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-2xl bg-white shadow-md rounded-2xl p-6 mt-6 border border-slate-100">
        <h1 class="text-2xl font-bold text-center text-emerald-800 mb-2">معجم الحقول الدلالية القرآنية</h1>
        <p class="text-sm text-slate-500 text-center mb-6">ابحث عن أي كلمة أو جذر قرآني لاستخراج التحليل اللغوي والدلالي</p>

        <!-- إعداد مفتاح API (يظهر مرة واحدة ويُحفظ تلقائياً) -->
        <div id="apiKeySection" class="mb-4 p-3 bg-amber-50 border border-amber-200 rounded-xl hidden">
            <label class="block text-xs font-bold text-amber-800 mb-1">مفتاح Google Gemini API:</label>
            <div class="flex gap-2">
                <input type="password" id="apiKeyInput" placeholder="أدخل مفتاح API هنا..." 
                    class="flex-1 px-3 py-2 border border-amber-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-1 focus:ring-amber-500">
                <button onclick="saveApiKey()" class="bg-amber-700 hover:bg-amber-800 text-white px-4 py-2 rounded-lg text-sm font-medium">حفظ المفتاح</button>
            </div>
        </div>

        <!-- حقل البحث -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="searchInput" placeholder="اكتب الكلمة القرآنية أو الجذر (مثل: صدقة، رحمة)..." 
                class="flex-1 px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-600 text-base">
            <button onclick="performSearch()" id="searchBtn"
                class="bg-emerald-700 hover:bg-emerald-800 text-white px-6 py-3 rounded-xl font-medium transition-colors cursor-pointer">
                بحث
            </button>
        </div>

        <!-- زر لإظهار إعدادات المفتاح إذا أراد المستخدم تغييره -->
        <div class="text-left mb-4">
            <button onclick="toggleApiKeyBox()" class="text-xs text-slate-400 hover:text-emerald-700 underline">إعدادات المفتاح</button>
        </div>

        <!-- منطقة النتائج -->
        <div id="resultArea" class="hidden bg-emerald-50/50 border border-emerald-100 rounded-xl p-4 text-slate-700 leading-relaxed">
            <h3 class="font-bold text-emerald-900 mb-2 border-b border-emerald-200 pb-1">نتيجة التحليل الدلالي:</h3>
            <div id="resultContent" class="whitespace-pre-wrap text-sm sm:text-base"></div>
        </div>
    </div>

    <!-- استدعاء Google Gen AI SDK عبر المتصفح -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>

    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        // التحقق من وجود المفتاح عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (!savedKey) {
                document.getElementById('apiKeySection').classList.remove('hidden');
            }
        });

        window.saveApiKey = function() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) {
                alert('الرجاء إدخال مفتاح صحيح.');
                return;
            }
            localStorage.setItem('gemini_api_key', key);
            document.getElementById('apiKeySection').classList.add('hidden');
            alert('تم حفظ المفتاح بنجاح!');
        };

        window.toggleApiKeyBox = function() {
            const box = document.getElementById('apiKeySection');
            box.classList.toggle('hidden');
        };

        window.performSearch = async function() {
            const query = document.getElementById('searchInput').value.trim();
            const resultArea = document.getElementById('resultArea');
            const resultContent = document.getElementById('resultContent');
            const searchBtn = document.getElementById('searchBtn');

            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                document.getElementById('apiKeySection').classList.remove('hidden');
                alert('الرجاء إدخال وحفظ مفتاح Gemini API أولاً.');
                return;
            }

            if (!query) {
                alert('الرجاء كتابة كلمة للبحث عنها.');
                return;
            }

            resultArea.classList.remove('hidden');
            resultContent.innerHTML = 'جاري تحليل الحقل الدلالي واستخراج المعاني...';
            searchBtn.disabled = true;

            try {
                const ai = new GoogleGenAI({ apiKey: apiKey }); 
                
                const prompt = `أنت عالم لغة وخبير في معجم الحقول الدلالية القرآنية. قم بتحليل الكلمة القرآنية التالية بدقة: "${query}".
                قدم التحليل بالشكل التالي:
                1. الجذر اللغوي والمادة.
                2. الحقل الدلالي الأساسي الذي تنتمي إليه.
                3. الآيات أو السياق القرآني الأبرز للكلمة.
                4. الدلالة المركزية والمعنى المعجمي باختصار وتنسيق مرتب.`;

                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: prompt,
                });

                resultContent.innerHTML = response.text;
            } catch (error) {
                console.error(error);
                resultContent.innerHTML = 'حدث خطأ أثناء الاتصال بالمعجم الذكي. تأكد من صحة مفتاح الـ API وتوفر الشبكة.';
            } finally {
                searchBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
